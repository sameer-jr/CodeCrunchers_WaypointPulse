map $http_x_forwarded_proto $waypoint_forwarded_proto {
  default $scheme;
  https https;
  http http;
}
server {
  listen ${PORT};
  listen [::]:${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
  resolver_timeout 5s;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;

  location /api/ {
    client_max_body_size 5m;
    set $waypoint_api_upstream "${API_UPSTREAM}";
    proxy_pass $waypoint_api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $waypoint_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
